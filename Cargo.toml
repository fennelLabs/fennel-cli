[package]
name = "fennel-cli"
version = "1.1.3"
edition = "2021"
resolver = "2"

[[bin]]
name = "fennel-cli"
path = "src/main.rs"

[[bin]]
name = "fennel-ipfs"
path = "src/ipfs/main.rs"

[[bin]]
name = "fennel-wf"
path = "src/wf/main.rs"

[dependencies]
clap = { version = "3.0.10", features = ["derive"] }

anyhow = "1"
aes = "0.7.5"
bytes = "1.1.0"
rand = "0.8.4"
sha3 = "0.10.0"
jsonrpsee = { version = "0.15.1", features = ["full"] }
jsonrpsee-http-server = "0.15.1"
jsonrpsee-http-client = "0.15.1"
jsonrpsee-proc-macros = "0.15.1"
tokio = { version = "0.2", features = ["full"] }
warp = "0.2"
parking_lot = "0.10.0"
serde = { version = "1", features = ["derive"] }
hex = "0.4.3"
x25519-dalek = "2.0.0-pre.1"
codec = { version = "3.7.5", package = "parity-scale-codec", features = ["derive"] }
fennel-lib = { git = "https://github.com/fennelLabs/fennel-lib", branch = "whiteflagupdatefennellib2025", package = "fennel-lib", default-features = false }
whiteflag-rust = { git = "https://github.com/fennelLabs/whiteflag-rust", branch = "whiteflagupdate2025", package = "fennel-whiteflag" }
wf_cli = { git = "https://github.com/fennelLabs/whiteflag-rust", branch = "whiteflagupdate2025", package = "wf_cli" }
wf_auth = { git = "https://github.com/fennelLabs/whiteflag-rust", branch = "whiteflagupdate2025" }
futures = "0.3"
serde_json = "1.0.81"

[dev-dependencies]
once_cell = "1.9.0"
criterion = { version = "0.4", features = ["html_reports"] }

[[bench]]
name = "crypto_benchmark"
harness = false
